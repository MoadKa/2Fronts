    <!-- Fonts loaded here (not via CSS @import) so the browser fetches them in
         parallel with the app CSS instead of chaining behind it. display=swap
         renders fallback text immediately, avoiding invisible-text on first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Familjen Grotesk sets headings, numerals, buttons and short structural
         labels; Archivo sets everything read as a sentence. Two faces, no
         third, no monospace outside the embed snippet. DM Sans and Space
         Grotesk left with the app surfaces they were carrying, which now speak
         the same world as the home page; Fraunces, Schibsted and Fragment Mono
         left earlier with the discarded Nachttisch home page.
         (The standalone pages under public/ still load their own fonts in
         their own <head> and are unaffected by this line.) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap"
